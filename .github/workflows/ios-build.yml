name: iOS unsigned build
run-name: iOS unsigned build · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "lib/**"
      - "ios/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Boot an iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if "iPhone" in device["name"]))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Run backup and restore integration test
        timeout-minutes: 15
        run: >-
          flutter test integration_test/backup_restore_flow_test.dart
          -d "${{ steps.simulator.outputs.udid }}"
      - name: Reset the simulator app between integration tests
        if: always()
        run: |
          xcrun simctl terminate "${{ steps.simulator.outputs.udid }}" app.personaljournal.mobile || true
          xcrun simctl uninstall "${{ steps.simulator.outputs.udid }}" app.personaljournal.mobile || true
      - name: Run journal integration test
        timeout-minutes: 15
        run: >-
          flutter test integration_test/journal_flow_test.dart
          -d "${{ steps.simulator.outputs.udid }}"
      - name: Build unsigned device app
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent Payload personal-journal-unsigned.ipa
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: personal-journal-unsigned-ios
          path: personal-journal-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
